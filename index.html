<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>▶ YouTube</h2>
        <input type="text" placeholder="Search">
        <button>Search</button>
    </header>

    <div class="layout">

            <p>🏠 Home</p>
            <p>🎬 Shorts</p>
            <p>📺 Subscriptions</p>
            <p>📚 Library</p>
        </aside>

        <main>
            <h2>Recommended Videos</h2>
            <div class="videos">
                <article>
                    <img src="https://placehold.co/400x225/334155/ffffff?text=HTML+Tutorial" alt="HTML tutorial">
                    <h3>Learn HTML for Beginners</h3>
                    <p>Code Academy</p>
                </article>
                <article>
                    <img src="https://placehold.co/400x225/7c3aed/ffffff?text=CSS+Tutorial" alt="CSS tutorial">
                    <h3>Learn CSS in 30 Minutes</h3>
                    <p>Web Development</p>
                </article>
                <article>
                    <img src="https://placehold.co/400x225/047857/ffffff?text=JavaScript" alt="JavaScript tutorial">
                    <h3>JavaScript Basics</h3>
                    <p>Programming Hub</p>
                </article>
                <article>
                    <img src="https://placehold.co/400x225/b45309/ffffff?text=Web+Design" alt="Web design tutorial">
                    <h3>Build Your First Website</h3>
                    <p>Design School</p>
                </article>
            </div>
    
</body>
</html>
